<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div align="center">
    <div align="center" class="border"
    <div class="header">
     <h1 class="word">Register</h1>
    </div>
    <h2 class="word"
    <form action="/register" methods="POST">
        <div class="msg">{{msg}}</div>
        <input id="username" name="username" type="text" placeholders="Enter your username"
        class="textbook"><br></br>
        <input id="password" name="password" type="text" placeholders="Enter your Password"
        class="textbox"><br></br>
        <input id="email" name="email" type="text" placeholders="Enter your Email" class="textbox"><br></br>
        <input type="submit" value="Sign Up" class="btn"><br></br>
    </form>
    </div>
</div>

</body>
</html>
